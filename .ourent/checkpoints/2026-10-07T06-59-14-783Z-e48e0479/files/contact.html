<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Kamol Aliboyev</title>
<meta name="description" content="Contact Kamol Aliboyev.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C5CFF'/%3E%3Ctext x='32' y='43' font-family='Inter,Arial,sans-serif' font-size='30' font-weight='800' fill='%23fff' text-anchor='middle'%3EKA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<div class="glow" aria-hidden="true"></div>
<main id="main">
<section class="hd wrap"><p class="lab">Contact</p><h1>Let's build something useful.</h1>
<div class="two">
<div class="card cform"><form class="fm" id="fm" novalidate>
<div class="r2"><label>Name<input id="nm" required autocomplete="name"></label><label>Email<input type="email" required autocomplete="email"></label></div>
<div class="r2"><label>Project type<select><option>Website</option><option>SaaS platform</option><option>Telegram bot</option><option>AI / automation</option><option>Other</option></select></label>
<label>Budget<select><option>Not sure yet</option><option>Small project</option><option>Medium project</option><option>Large project</option></select></label></div>
<label>Message<textarea rows="5" required></textarea></label>
<button class="btn pri" type="submit">Send message →</button></form>
<div class="ok" id="ok" hidden role="status"><h3>Thanks, <span id="who"></span>.</h3><p class="lead">Your message was received. I will get back to you soon.</p></div></div>
<div class="card cform"><ul class="ct one"><li>Telegram <a href="https://t.me/your_username">@your_username</a></li><li>Email <a href="mailto:your-email@example.com">your-email@example.com</a></li><li>GitHub <a href="https://github.com/your-username">github.com/your-username</a></li><li>LinkedIn <a href="https://linkedin.com/in/your-username">linkedin.com/in/your-username</a></li></ul></div>
</div></section>
</main>
<script src="app.js"></script>
</body>
</html>
