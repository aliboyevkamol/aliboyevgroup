<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — Kamol Aliboyev</title>
<meta name="description" content="Create an account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
<div class="glow" aria-hidden="true"></div>
<main id="main">
<section class="hd wrap"><div class="narrow"><p class="lab">Account</p><h1>Create account</h1>
<div class="card cform"><form class="fm" id="rf" novalidate><label>Full Name<input id="nm" autocomplete="name" required></label><label>Email<input type="email" id="em" autocomplete="email" required></label>
<label>Password<input type="password" id="pw" autocomplete="new-password" required></label><label>Confirm Password<input type="password" id="pw2" autocomplete="new-password" required></label>
<p class="err" id="err" role="alert"></p><button class="btn pri" type="submit">Register</button></form></div>
<p class="lead" style="margin-top:16px">Already have an account? <a href="login.html" id="alt"><em>Log in</em></a></p></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
