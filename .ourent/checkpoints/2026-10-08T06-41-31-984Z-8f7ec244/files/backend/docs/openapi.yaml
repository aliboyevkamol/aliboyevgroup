        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /products/{ref}:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
    get:
      tags: [Products]
      summary: "Product by id or slug"
      responses:
        "200": {description: OK}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Conflict, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /products/{id}/access:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Products]
      summary: "Check purchase access and get a 5-minute download URL"
      security: [{bearer: []}]
      responses:
        "200": {description: OK}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Authentication required, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Conflict, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /products/{id}/download:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Products]
      summary: "302 redirect to the signed download URL (purchasers only)"
      security: [{bearer: []}]
      responses:
        "200": {description: OK}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Authentication required, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Conflict, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /products/{id}/favorite:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Favorites]
      summary: "Add to favorites"
      security: [{bearer: []}]
      responses:
        "201": {description: Created}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Authentication required, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Conflict, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    delete:
      tags: [Favorites]
      summary: "Remove from favorites"
      security: [{bearer: []}]
      responses:
        "200": {description: OK}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Authentication required, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
