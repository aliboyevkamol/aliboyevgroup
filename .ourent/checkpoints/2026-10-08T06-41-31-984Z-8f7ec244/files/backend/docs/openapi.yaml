  /products:
    get:
      tags: [Products]
      summary: "List published products (search, category, featured, sort, page, limit)"
      responses:
        "200": {description: OK}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
