        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Conflict, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /comments/{id}/reply:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Comments]
      summary: "Reply to a comment (threads stay one level deep)"
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {"content": "Thanks!"}
      responses:
        "201": {description: Created}
        "400": {description: Malformed request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Authentication required, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Conflict, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Validation error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /comments/{id}:
    parameters:
