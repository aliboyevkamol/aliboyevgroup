<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Kamol Aliboyev</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="../assets/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="login" id="login">
  <form class="lcard" id="lf" novalidate>
    <div class="brand"><img class="brand-logo" src="../assets/logo-360.png" alt="ALIBOYEV GROUP" width="360" height="123" decoding="async"><span>ADMIN PANEL</span></div>
    <h1>Welcome back</h1>
    <p class="mu">Sign in to manage products, projects, blog and orders.</p>
    <label>Email<input type="email" id="ae" autocomplete="username" inputmode="email"></label>
    <label>Password<input type="password" id="ap" autocomplete="current-password"></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn pri" type="submit">Sign in</button>
        <p class="note">Admin accounts are created on the server with the <code>create-admin</code> command.</p>
  </form>
</section>

<div id="app" hidden>
  <aside class="side" id="side" aria-label="Admin navigation">
    <div class="brand"><img class="brand-logo" src="../assets/logo-360.png" alt="ALIBOYEV GROUP" width="360" height="123" decoding="async"><span>ADMIN PANEL</span></div>
    <nav id="nav"></nav>
    <div class="sf"><a href="../index.html" class="nl">↗ Public site</a><button class="nl" id="out">⏻ Logout</button></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top"><button class="ib" id="menu" aria-label="Open menu">☰</button><h1 id="ttl">Dashboard</h1><span class="grow"></span><button class="ib" id="thm" aria-label="Toggle theme">◐</button><img class="av" src="../assets/favicon-64.png" alt="" width="38" height="38"></header>
    <main id="view"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Quick navigation"></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
